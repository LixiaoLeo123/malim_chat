[package]
name = "malim-chat"
version = "0.1.0"
description = "Secure multi-provider AI chat"
authors = ["malim_chat"]
edition = "2021"

[lib]
name = "malim_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
