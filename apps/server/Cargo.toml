[package]
name = "malim-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.95"
argon2 = "0.5.3"
async-stream = "0.3.6"
axum = { version = "0.8.1", features = ["macros", "json"] }
base64 = "0.22.1"
chrono = { version = "0.4.39", features = ["serde"] }
csv = "1.3.1"
dotenvy = "0.15.7"
flate2 = "1.0.35"
futures-util = "0.3.31"
http = "1.2.0"
jsonwebtoken = { version = "9.3.0", features = ["use_pem"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rs-mdict = "0.1.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.2", features = ["cors", "trace", "request-id", "limit", "timeout", "sensitive-headers"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
