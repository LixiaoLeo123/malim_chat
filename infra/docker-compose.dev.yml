services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: malim_chat
      POSTGRES_USER: malim
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  searxng:
    image: searxng/searxng:2025.2.16-345c5e5
    ports:
      - "8088:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
volumes:
  postgres_data:
